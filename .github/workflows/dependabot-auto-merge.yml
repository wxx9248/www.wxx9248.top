# Approves Dependabot's minor and patch updates and merges them once the
# required checks pass. Major updates wait for a person. The master ruleset
# requires an approval of the last push and the build job of deploy.yml; this
# workflow gives the approval, and runs again after Dependabot rebases.
name: Dependabot Auto-Merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"

      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
