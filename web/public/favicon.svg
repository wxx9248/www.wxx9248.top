    <!-- > -->
    <path fill="#9be9f2" d="M2 4h2v1H2zM3 5h2v1H3zM4 6h2v1H4zM5 7h2v1H5zM4 8h2v1H4zM3 9h2v1H3zM2 10h2v1H2z"/>
